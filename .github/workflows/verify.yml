name: Riverbraid Documentation Currentness Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-documentation-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Documentation subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.0'

      - name: Run scoped currentness verifier
        run: node verify-documentation.mjs
